{% extends "base.html" %}
{% block title %}Ver Usuario{% endblock %}
{% block content %}
<body>
    <main class="py-8 px-16">
        <h1 class="font-bold text-3xl">Usuario {{data.id}}</h1>
        <div class="w-fit border border-2 border-gray-500 pl-8 py-8 pr-32 my-8 grid gap-4">
            <p class="font-bold">Nombre Completo: <span class="font-normal">{{data.nombre}} {{data.apellido}}</span></p>
            <p class="font-bold">Email: <span class="font-normal">{{data.email}}</span></p>
            <p class="font-bold">Fecha Creación: <span class="font-normal">{{data.created_at}}</span></p>
            <p class="font-bold">Fecha Actualización: <span class="font-normal">{{data.updated_at}}</span></p>
        </div>
        <div class="links flex gap-4">
            <a href="/usuarios/editar/{{data.id}}" class="text-blue-500 hover:text-sky-700 font-semibold underline">Editar</a>
            <form action="/usuarios/borrar/{{data.id}}" method="post">
                <button class=" text-red-500 hover:text-rose-700 font-semibold underline" type="submit">Borrar</button>
            </form>
        </div>
    </main>
</body>
{% endblock %}
