{% extends "base.html" %}
{% block title %}Editar Usuario{% endblock %}
{% block content %}
<body class="font-[Montserrat] w-full min-h-screen">
    <main class="w-full min-h-screen grid grid-flow-row-dense place-items-center">
        <h1 class="font-bold text-3xl">Editar Usuario {{data.id}}</h1>
        <form action="/editar_usuario" method="post" class="container mx-auto gap-3 w-1/2 bg-white p-4 place-self-start grid gap-4">
            <div class="form-group grid">
                <input type="text" name="INID" id="INID" value="{{data.id}}" hidden>
                <label for="INNombre" class="mb-1">Nombre:</label>
                <input type="text" name="INNombre" id="INNombre" value="{{data.nombre}}" class="border border-2 border-gray-300 rounded-md py-2 pl-2" required>
            </div>
            <div class="form-group grid">
                <label for="INApellido" class="mb-1">Apellido:</label>
                <input type="text" name="INApellido" id="INApellido" value="{{data.apellido}}" class="border border-2 border-gray-300 rounded-md py-2 pl-2" required>
            </div>
            <div class="form-group grid">
                <label for="INEmail" class="mb-1">Email:</label>
                <input type="email" name="INEmail" id="INEmail" value="{{data.email}}" class="border border-2 border-gray-300 rounded-md py-2 pl-2" required>
            </div>
            <button type="submit" class="bg-blue-500 px-6 py-2 font-bold text-white rounded-sm place-self-start hover:brightness-90 ">Actualizar</button>
        </form>
    </main>
</body>
{% endblock %}
